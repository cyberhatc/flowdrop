name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: flutter pub get
      # Flutter 3.47 expects compileSdk 37 (receive_sharing_intent needs it)
      - run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" "build-tools;37.0.0"
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath flowdrop-windows.zip -Force
      - uses: softprops/action-gh-release@v2
        with:
          files: flowdrop-windows.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf build/flowdrop-linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: softprops/action-gh-release@v2
        with:
          files: build/flowdrop-linux.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: flutter pub get
      - run: flutter build macos --release
      - run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent FlowDrop.app FlowDrop-macos.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: build/macos/Build/Products/Release/FlowDrop-macos.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: flutter pub get
      # Unsigned simulator build: proves the iOS target compiles on CI.
      # Distribution builds need an Apple Developer account to sign —
      # see docs/PACKAGING.md.
      - run: flutter build ios --no-codesign --simulator
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
